<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Browser evidence fixture</title>
    <style>
      html {
        background: #edf2f7;
        font:
          18px Arial,
          sans-serif;
      }
      body {
        margin: 32px;
        color: #17324d;
      }
      main {
        background: white;
        border: 2px solid #17324d;
        padding: 24px;
        width: 460px;
      }
      h1 {
        font-size: 26px;
        margin: 0 0 20px;
      }
      input,
      button {
        font: inherit;
        padding: 8px;
      }
      button {
        background: #17324d;
        color: white;
        border: 0;
      }
      output {
        display: block;
        min-height: 32px;
        margin-top: 20px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Browser evidence fixture</h1>
      <form id="greeting">
        <label for="name">Name</label>
        <input id="name" name="name" required />
        <button type="submit">Greet</button>
      </form>
      <output id="result" aria-live="polite">Ready</output>
    </main>
    <script>
      document
        .querySelector("#greeting")
        .addEventListener("submit", async (event) => {
          event.preventDefault();
          const response = await fetch("/api/greeting", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              name: document.querySelector("#name").value,
            }),
          });
          const result = await response.json();
          document.querySelector("#result").textContent = result.message;
          console.info("Greeting rendered");
        });
    </script>
  </body>
</html>
